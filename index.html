
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <main class="container">
        <h1>My Shopping List</h1>

        <form id="shopping-form">
            <label for="item-name">item</label>
            <input id="item-name" type="text" placeholder="Item name" required>
            <label for="price">price</label>
            <input id="item-price" type="number" placeholder="Price" min="0" step="0.01" required>
            <button type="submit">Add Item</button>
        </form>
        <div>
            <h2>list</h2>
        <section id="grid"></section>
        <section class="hidden-btn"><button id="clear-btn">clear</button></section>
        </div>
     
    <script src="script.js" defer></script>
</body>
</html>
